name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes the run that is
# still in flight, except on the default branch where every push is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run check:format

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright webServer boots the test harness on 127.0.0.1:3100, so only
    # one browser-test job may run at a time across the whole repository.
    concurrency:
      group: e2e-harness-port-3100
      cancel-in-progress: false
    env:
      # playwright.config.ts defaults to the installed Chrome (channel: "chrome").
      # CI runners have no Chrome, so point it at the Playwright-managed Chromium.
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
